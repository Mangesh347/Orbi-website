<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Orbi mark: an orb with an orbit ring passing in front of it and a small moon. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263a"/>
      <stop offset="1" stop-color="#0b131d"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#a7fff2"/>
      <stop offset="0.45" stop-color="#00d4b8"/>
      <stop offset="1" stop-color="#1d5fd6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb4ff"/>
      <stop offset="1" stop-color="#d9c4ff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <g transform="rotate(-24 64 64)">
    <ellipse cx="64" cy="64" rx="47" ry="16" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.55"/>
  </g>
  <circle cx="64" cy="64" r="27" fill="url(#orb)"/>
  <circle cx="55" cy="54" r="7" fill="#ffffff" opacity="0.35"/>
  <g transform="rotate(-24 64 64)">
    <path d="M17 64 A47 16 0 0 0 111 64" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="93" cy="40" r="8" fill="#ffb86b"/>
</svg>
